[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acpsa-flids"
version = "0.1.0"
description = "Joint class-exposure DP, threshold aggregation and shrinkage for federated IDS"
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "scipy>=1.10", "matplotlib>=3.7", "PyYAML>=6", "requests>=2.31", "psutil>=5.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
